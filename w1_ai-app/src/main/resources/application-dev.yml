server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:
      - optional:file:${user.dir}/config/application-local.yml
      - optional:file:${user.dir}/../config/application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:15432/w1_ai?stringtype=unspecified
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件的最大限制
      max-request-size: 50MB
# MyBatis 配置【如需使用记得打开】
mybatis-plus:
  mapper-locations: classpath:mybatis/mapper/*.xml
  # config-location: classpath:/mybatis/config/mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换
ai:
  llm:
    api-key: ${AI_LLM_API_KEY:}
    base-url: ${AI_LLM_BASE_URL:https://api.deepseek.com}
    model: ${AI_LLM_MODEL:deepseek-v4-flash}
  embedding:
    api-key: ${AI_EMBEDDING_API_KEY:}
    base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${AI_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

academic:
  s2:
    base-url: ${SEMANTIC_SCHOLAR_BASE_URL:https://api.semanticscholar.org/graph/v1}
    api-key: ""

redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 16379
      database: 2
python:
  parser-type: ${PDF_PARSER_TYPE:monkeyocr}
  parser-version: ${PDF_PARSER_VERSION:unknown}
  path-python: ${PYTHON_EXECUTABLE:python}
  script-path: ${LLAMA_PARSE_SCRIPT:${user.dir}/python/paper_parser.py}
  monkeyocr:
    base-url: ${MONKEYOCR_BASE_URL:http://127.0.0.1:8000}
    http-output-dir: ${MONKEYOCR_HTTP_OUTPUT_DIR:${user.dir}/data/monkeyocr-http-output}
    http-timeout-seconds: ${MONKEYOCR_HTTP_TIMEOUT_SECONDS:1800}
    python-path: ${MONKEYOCR_PYTHON:${PYTHON_EXECUTABLE:python}}
    repo-path: ${MONKEYOCR_REPO_PATH:}
    script-path: ${MONKEYOCR_SCRIPT_PATH:parse.py}
    output-dir: ${MONKEYOCR_OUTPUT_DIR:${user.dir}/data/monkeyocr-output}
    config-path: ${MONKEYOCR_CONFIG_PATH:}
    timeout-seconds: ${MONKEYOCR_TIMEOUT_SECONDS:1800}
    omp-num-threads: ${MONKEYOCR_OMP_NUM_THREADS:1}

upload:
  path: ${UPLOAD_PATH:${user.dir}/data/upload}

paper:
  retrieval:
    mode: ${PAPER_RETRIEVAL_MODE:hybrid}
    candidate-limit: ${PAPER_RETRIEVAL_CANDIDATE_LIMIT:30}
    top-k: ${PAPER_RETRIEVAL_TOP_K:8}
    smart-read-limit: ${PAPER_RETRIEVAL_SMART_READ_LIMIT:2}
    smart-read-single-section-ratio: ${PAPER_RETRIEVAL_SMART_READ_SINGLE_SECTION_RATIO:1.35}
    chunk:
      max-chars: ${PAPER_CHUNK_MAX_CHARS:3200}
      overlap-chars: ${PAPER_CHUNK_OVERLAP_CHARS:400}
  ingestion:
    lease-minutes: ${PAPER_INGEST_LEASE_MINUTES:120}
    heartbeat-seconds: ${PAPER_INGEST_HEARTBEAT_SECONDS:30}
    stale-minutes: ${PAPER_INGEST_STALE_MINUTES:130}
    recovery-batch-size: ${PAPER_INGEST_RECOVERY_BATCH_SIZE:10}
    recovery:
      enabled: ${PAPER_INGEST_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${PAPER_INGEST_RECOVERY_DELAY_MS:60000}
    executor:
      core-pool-size: ${PAPER_INGEST_CORE_POOL_SIZE:2}
      max-pool-size: ${PAPER_INGEST_MAX_POOL_SIZE:4}
      queue-capacity: ${PAPER_INGEST_QUEUE_CAPACITY:20}
      await-termination-seconds: ${PAPER_INGEST_SHUTDOWN_WAIT_SECONDS:30}
  librarian:
    audit:
      version: ${PAPER_LIBRARIAN_AUDIT_VERSION:librarian-evidence-v1}
      prompt-version: ${PAPER_LIBRARIAN_PROMPT_VERSION:librarian-relation-v1}
      neighbor-limit: ${PAPER_LIBRARIAN_NEIGHBOR_LIMIT:3}
      evidence-limit: ${PAPER_LIBRARIAN_EVIDENCE_LIMIT:4}
      review-threshold: ${PAPER_LIBRARIAN_REVIEW_THRESHOLD:0.65}
