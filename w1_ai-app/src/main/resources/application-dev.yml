server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:
      - optional:file:${user.dir}/config/application-local.yml
      - optional:file:${user.dir}/../config/application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:15432/w1_ai?stringtype=unspecified
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件的最大限制
      max-request-size: 50MB
# MyBatis 配置【如需使用记得打开】
mybatis-plus:
  mapper-locations: classpath:mybatis/mapper/*.xml
  # config-location: classpath:/mybatis/config/mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换
ai:
  llm:
    api-key: ${AI_LLM_API_KEY:}
  embedding:
    api-key: ${AI_EMBEDDING_API_KEY:}
    base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

academic:
  s2:
    base-url: ${SEMANTIC_SCHOLAR_BASE_URL:https://api.semanticscholar.org/graph/v1}
    api-key: ""

redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 16379
      database: 2
python:
  parser-type: ${PDF_PARSER_TYPE:monkeyocr}
  path-python: ${PYTHON_EXECUTABLE:python}
  script-path: ${LLAMA_PARSE_SCRIPT:${user.dir}/python/paper_parser.py}
  monkeyocr:
    base-url: ${MONKEYOCR_BASE_URL:http://127.0.0.1:8000}
    http-output-dir: ${MONKEYOCR_HTTP_OUTPUT_DIR:${user.dir}/data/monkeyocr-http-output}
    http-timeout-seconds: ${MONKEYOCR_HTTP_TIMEOUT_SECONDS:1800}
    python-path: ${MONKEYOCR_PYTHON:${PYTHON_EXECUTABLE:python}}
    repo-path: ${MONKEYOCR_REPO_PATH:}
    script-path: ${MONKEYOCR_SCRIPT_PATH:parse.py}
    output-dir: ${MONKEYOCR_OUTPUT_DIR:${user.dir}/data/monkeyocr-output}
    config-path: ${MONKEYOCR_CONFIG_PATH:}
    timeout-seconds: ${MONKEYOCR_TIMEOUT_SECONDS:1800}
    omp-num-threads: ${MONKEYOCR_OMP_NUM_THREADS:1}

upload:
  path: ${UPLOAD_PATH:${user.dir}/data/upload}
